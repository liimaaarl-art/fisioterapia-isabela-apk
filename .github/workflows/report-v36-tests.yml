name: Relatorios v36 - testes
on:
  pull_request:
    paths:
      - 'isabela_v36_reports.js'
      - 'isabela_v34_audio.js'
      - 'isabela_v37_report_presentation.js'
      - 'tests/report-v37.test.cjs'
      - 'tests/report-v36.test.cjs'
      - '.github/workflows/report-v36-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relatorios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Testar selecao, PDF e salvamento
        run: |
          node --check isabela_v34_audio.js
          node --check isabela_v36_reports.js
          node --check isabela_v37_report_presentation.js
          node --test tests/report-v36.test.cjs tests/report-v37.test.cjs
