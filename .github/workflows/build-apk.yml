name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir -p projeto
          unzip -q Fisioterapia_Isabela_APK_GitHub.zip -d projeto
          test -f projeto/Fisioterapia_Isabela_APK/settings.gradle
          echo "Projeto encontrado com sucesso"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK
        working-directory: projeto/Fisioterapia_Isabela_APK
        run: gradle assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Fisioterapia-Isabela-APK
          path: projeto/Fisioterapia_Isabela_APK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
