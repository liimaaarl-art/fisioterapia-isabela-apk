name: Build Isabela Martins APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar dependencias
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@8 @capacitor/android@8 @capacitor/local-notifications@8
          npm install --save-dev @capacitor/cli@8 @capacitor/assets

      - name: Preparar aplicativo v34 com áudio automático
        run: |
          mkdir -p www
          for f in index.html isabela_v24_functional.js isabela_v26_premium.js isabela_v27_agenda.js isabela_v29_ai_evolution.js isabela_v30_gemini_only.js isabela_v31_gemini_resilience.js isabela_v33_appointment_reminders.js isabela_v34_audio.js brand_menu.b64 icon_v25.b64; do test -f "$f" || exit 1; done
          cp index.html www/index.html
          cp isabela_v24_functional.js www/
          cp isabela_v26_premium.js www/
          cp isabela_v27_agenda.js www/
          cp isabela_v29_ai_evolution.js www/
          cp isabela_v30_gemini_only.js www/
          cp isabela_v31_gemini_resilience.js www/
          cp isabela_v33_appointment_reminders.js www/
          cp isabela_v34_audio.js www/
          node --check www/isabela_v24_functional.js
          node --check www/isabela_v26_premium.js
          node --check www/isabela_v27_agenda.js
          node --check www/isabela_v29_ai_evolution.js
          node --check www/isabela_v30_gemini_only.js
          node --check www/isabela_v31_gemini_resilience.js
          node --check www/isabela_v33_appointment_reminders.js
          node --check www/isabela_v34_audio.js
          node --test tests/audio.test.cjs tests/edge.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('www/index.html')
          text=p.read_text(encoding='utf-8')
          tags=[
              '<script src="isabela_v24_functional.js"></script>',
              '<script src="isabela_v26_premium.js"></script>',
              '<script src="isabela_v27_agenda.js"></script>',
              '<script src="isabela_v29_ai_evolution.js"></script>',
              '<script src="isabela_v30_gemini_only.js"></script>',
              '<script src="isabela_v31_gemini_resilience.js"></script>',
              '<script src="isabela_v33_appointment_reminders.js"></script>',
              '<script src="isabela_v34_audio.js"></script>'
          ]
          if '</body>' not in text: raise SystemExit('body nao encontrado')
          for tag in tags:
              if tag not in text: text=text.replace('</body>',tag+'\n</body>')
          text=text.replace('Cloudflare Workers AI','Gemini').replace('Cloudflare','Gemini')
          for old in [
              'Isabela Martins • v23 TESTE • Avaliação completa e Agenda',
              'Isabela Martins • v24 • Avaliações funcionais e relatórios',
              'Isabela Martins • v25 • Avaliações funcionais e relatórios',
              'Isabela Martins • v26 • Avaliação Clínica Premium',
              'Isabela Martins • v27 • Agenda Informativa + Avaliação Clínica Premium',
              'Isabela Martins • v28 • Gemini + Agenda Informativa + Avaliação Clínica Premium',
              'Isabela Martins • v29 • Gemini Evolução Inteligente + Agenda Informativa',
              'Isabela Martins • v30 • Gemini Completo + Evolução Inteligente + Agenda Informativa',
              'Isabela Martins • v31 • Gemini Resiliente + Evolução Inteligente + Agenda Informativa',
              'Isabela Martins • v32 • Gemini Corrigido + Evolução Inteligente + Agenda Informativa'
          ]:
              text=text.replace(old,'Isabela Martins • v33 • Lembretes 10 min + Gemini + Agenda Informativa')
          text=text.replace('Isabela Martins • v33 • Lembretes 10 min + Gemini + Agenda Informativa','Isabela Martins • v34 • Áudio automático + Salvamento confirmado')
          brand=Path('brand_menu.b64').read_text().strip()
          icon=Path('icon_v25.b64').read_text().strip()
          base64.b64decode(brand,validate=True); base64.b64decode(icon,validate=True)
          repl="const BRAND_IMG='data:image/jpeg;base64,"+brand+"';\nconst BRAND_ICON='data:image/png;base64,"+icon+"';"
          text,n=re.subn(r"const BRAND_IMG='data:image/jpeg;base64,[^']*';",repl,text,count=1)
          if n!=1: raise SystemExit('BRAND_IMG nao localizado')
          old="function hydrateBrand(){document.querySelectorAll('[data-brand]').forEach(i=>i.src=BRAND_IMG)}"
          new="function hydrateBrand(){document.querySelectorAll('.brand img[data-brand],.auth-brand img[data-brand]').forEach(i=>i.src=BRAND_IMG);document.querySelectorAll('.side-profile img[data-brand]').forEach(i=>i.src=BRAND_ICON)}"
          if old in text: text=text.replace(old,new,1)
          css="\n/* Identidade visual Isabela Martins v33 */\n.brand{display:block!important;padding:5px 4px 18px!important;margin-bottom:7px!important;text-align:center!important}\n.brand img[data-brand]{display:block!important;width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important;border:0!important;border-radius:12px!important;box-shadow:0 8px 22px rgba(28,62,64,.13)!important;background:#1c3e40!important}\n.brand>div{display:none!important}\n.auth-brand{display:block!important;text-align:center!important;margin-bottom:24px!important}\n.auth-brand img[data-brand]{display:block!important;width:min(100%,340px)!important;height:auto!important;margin:0 auto!important;object-fit:contain!important;border:0!important;border-radius:14px!important;box-shadow:0 10px 28px rgba(28,62,64,.16)!important;background:#1c3e40!important}\n.auth-brand>div{display:none!important}\n.side-profile img[data-brand]{width:40px!important;height:40px!important;object-fit:cover!important;border-radius:50%!important;border:1px solid #d6bd78!important;background:#1c3e40!important}\n@media(max-width:900px){.brand{padding:5px 3px 16px!important}.brand img[data-brand]{width:100%!important;height:auto!important}}\n"
          text=text.replace('</style>',css+'\n</style>',1)
          p.write_text(text,encoding='utf-8')
          print('v33 com lembretes preparada.')
          PY

      - name: Validar fluxo completo no navegador móvel
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save playwright-core@1.62.1
          node tests/browser.cjs

      - name: Guardar evidência visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Isabela-v34-QA
          path: tests/isabela-v34-mobile.png
          if-no-files-found: ignore

      - name: Criar configuracao Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.florindosistemas.isabelamartins",
            "appName": "Isabela Martins",
            "webDir": "www"
          }
          EOF

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Liberar microfone e notificacoes no Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text(encoding='utf-8')
          additions=[
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />'
          ]
          missing=[x for x in additions if x not in text]
          if missing:
              m=re.search(r'<manifest[^>]*>',text)
              if not m: raise SystemExit('manifest nao encontrado')
              text=text[:m.end()]+'\n    '+'\n    '.join(missing)+text[m.end():]
              p.write_text(text,encoding='utf-8')
          PY

      - name: Criar som do lembrete
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math, wave, struct
          path='android/app/src/main/res/raw/isabela_reminder.wav'
          rate=44100
          parts=[(880,0.20),(0,0.06),(1175,0.24)]
          frames=[]
          for freq,dur in parts:
              n=int(rate*dur)
              for i in range(n):
                  if freq==0:
                      v=0
                  else:
                      attack=min(1.0,i/(rate*0.015))
                      release=min(1.0,(n-i)/(rate*0.05))
                      env=min(attack,release)
                      v=int(12000*env*math.sin(2*math.pi*freq*i/rate))
                  frames.append(struct.pack('<h',v))
          with wave.open(path,'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b''.join(frames))
          print(path)
          PY

      - name: Gerar icone IM
        run: |
          mkdir -p assets
          base64 -d icon_v25.b64 > assets/icon.png
          file assets/icon.png
          npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Isabela-Martins-v34-Audio-Automatico
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
