name: Build Isabela Martins APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar fluxo de IA
        run: node --test tests/*.test.mjs

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar dependencias
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@8
          npm install @capacitor/android@8
          npm install --save-dev @capacitor/cli@8
          npm install --save-dev @capacitor/assets

      - name: Preparar arquivos do aplicativo v24
        run: |
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERRO: index.html nao encontrado."
            exit 1
          fi

          if [ ! -f isabela_v24_functional.js ]; then
            echo "ERRO: modulo v24 nao encontrado."
            exit 1
          fi

          cp index.html www/index.html
          cp isabela_v24_functional.js www/isabela_v24_functional.js
          node --check www/isabela_v24_functional.js

          python3 - <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          text = path.read_text(encoding="utf-8")
          tag = '<script src="isabela_v24_functional.js"></script>'

          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit("Tag </body> nao encontrada no index.html")
              text = text.replace('</body>', tag + '\n</body>')

          text = text.replace(
              'Isabela Martins • v23 TESTE • Avaliação completa e Agenda',
              'Isabela Martins • v24 • Avaliações funcionais e relatórios'
          )
          path.write_text(text, encoding="utf-8")
          print("Modulo v24 injetado no aplicativo.")
          PY

          # No APK Android, reserva uma faixa segura abaixo da barra de status.
          # Move o cabecalho mobile inteiro para baixo e ajusta o conteudo da pagina.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          text = path.read_text(encoding="utf-8")
          marker = "android-statusbar-safe-header-v2"

          if marker in text:
              raise SystemExit("Ajuste da barra de status ja existe no HTML gerado")

          if "</head>" not in text:
              raise SystemExit("Tag </head> nao encontrada")

          override = '''
          <style id="android-statusbar-safe-header-v2">
          @media(max-width:760px){
            .im-mobile-header{
              top:32px!important;
              height:64px!important;
            }
            .im-mobile-header button{
              transform:none!important;
            }
            .main,html.im-light .main{
              padding-top:112px!important;
            }
          }
          </style>
          '''

          text = text.replace("</head>", override + "\n</head>", 1)
          path.write_text(text, encoding="utf-8")

          checks = [
              'id="android-statusbar-safe-header-v2"',
              'top:32px!important',
              'padding-top:112px!important',
          ]
          if not all(item in text for item in checks):
              raise SystemExit("Ajuste seguro do cabecalho mobile nao foi aplicado")

          print("Cabecalho mobile afastado 32px da barra de status Android.")
          PY

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/manifest.webmanifest
          fi

          if [ -f sw.js ]; then
            cp sw.js www/sw.js
          fi

          if [ -f icon.svg ]; then
            cp icon.svg www/icon.svg
          fi

      - name: Criar configuracao Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.florindosistemas.isabelamartins",
            "appName": "Isabela Martins",
            "webDir": "www",
            "server": { "hostname": "localhost", "androidScheme": "https" }
          }
          EOF

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Liberar microfone no Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise SystemExit("AndroidManifest.xml nao encontrado")

          text = path.read_text(encoding="utf-8")

          additions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />'
          ]

          missing = [item for item in additions if item not in text]

          if missing:
              match = re.search(r'<manifest[^>]*>', text)

              if not match:
                  raise SystemExit("Tag <manifest> nao encontrada")

              insert_at = match.end()
              block = "\n    " + "\n    ".join(missing)
              text = text[:insert_at] + block + text[insert_at:]
              path.write_text(text, encoding="utf-8")

          print("Permissoes de microfone configuradas.")
          PY

      - name: Gerar icone Android
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          else
            echo "icon.png nao encontrado. Mantendo icone padrao."
          fi

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android

      - name: Conferir permissoes Android
        run: |
          grep -n "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -n "MODIFY_AUDIO_SETTINGS" android/app/src/main/AndroidManifest.xml

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Isabela-Martins-v24-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
