name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Localizar e descompactar o projeto
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP_FILE"

          mkdir -p projeto
          unzip -q "$ZIP_FILE" -d projeto

          echo "Projeto descompactado."

      - name: Localizar projeto Android
        id: android
        shell: bash
        run: |
          GRADLEW=$(find projeto -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: O arquivo gradlew nao foi encontrado."
            echo "Conteudo do ZIP:"
            find projeto -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Projeto Android encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          sed -i 's/\r$//' "$GRADLEW"
          chmod +x "$GRADLEW"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Fisioterapia-Isabela-APK
          path: |
            ${{ steps.android.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
