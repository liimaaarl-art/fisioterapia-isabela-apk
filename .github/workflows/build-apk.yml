name: Build Isabela Martins APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar dependencias
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8 @capacitor/assets

      - name: Preparar aplicativo v25 e nova identidade visual
        run: |
          mkdir -p www
          test -f index.html || { echo "ERRO: index.html nao encontrado"; exit 1; }
          test -f isabela_v24_functional.js || { echo "ERRO: modulo funcional nao encontrado"; exit 1; }
          test -f brand_menu.b64 || { echo "ERRO: logo horizontal nao encontrada"; exit 1; }
          test -f icon_v25.b64 || { echo "ERRO: icone IM nao encontrado"; exit 1; }

          cp index.html www/index.html
          cp isabela_v24_functional.js www/isabela_v24_functional.js
          node --check www/isabela_v24_functional.js

          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          p = Path('www/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="isabela_v24_functional.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>')

          text = text.replace('Isabela Martins • v23 TESTE • Avaliação completa e Agenda', 'Isabela Martins • v25 • Avaliações funcionais e relatórios')
          text = text.replace('Isabela Martins • v24 • Avaliações funcionais e relatórios', 'Isabela Martins • v25 • Avaliações funcionais e relatórios')

          brand = Path('brand_menu.b64').read_text().strip()
          icon = Path('icon_v25.b64').read_text().strip()
          base64.b64decode(brand, validate=True)
          base64.b64decode(icon, validate=True)
          brand_uri = 'data:image/jpeg;base64,' + brand
          icon_uri = 'data:image/png;base64,' + icon

          pattern = r"const BRAND_IMG='data:image/jpeg;base64,[^']*';"
          repl = "const BRAND_IMG='" + brand_uri + "';\nconst BRAND_ICON='" + icon_uri + "';"
          text, n = re.subn(pattern, repl, text, count=1)
          if n != 1:
              raise SystemExit('BRAND_IMG nao localizado no HTML')

          old = "function hydrateBrand(){document.querySelectorAll('[data-brand]').forEach(i=>i.src=BRAND_IMG)}"
          new = "function hydrateBrand(){document.querySelectorAll('.brand img[data-brand],.auth-brand img[data-brand]').forEach(i=>i.src=BRAND_IMG);document.querySelectorAll('.side-profile img[data-brand]').forEach(i=>i.src=BRAND_ICON)}"
          if old not in text:
              raise SystemExit('hydrateBrand nao localizado no HTML')
          text = text.replace(old, new, 1)

          css = '''\n/* Identidade visual Isabela Martins • v25 */
.brand{display:block!important;padding:5px 4px 18px!important;margin-bottom:7px!important;text-align:center!important}
.brand img[data-brand]{display:block!important;width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center!important;border:0!important;border-radius:12px!important;box-shadow:0 8px 22px rgba(28,62,64,.13)!important;background:#1c3e40!important}
.brand>div{display:none!important}
.auth-brand{display:block!important;text-align:center!important;margin-bottom:24px!important}
.auth-brand img[data-brand]{display:block!important;width:min(100%,340px)!important;height:auto!important;margin:0 auto!important;object-fit:contain!important;border:0!important;border-radius:14px!important;box-shadow:0 10px 28px rgba(28,62,64,.16)!important;background:#1c3e40!important}
.auth-brand>div{display:none!important}
.side-profile img[data-brand]{width:40px!important;height:40px!important;object-fit:cover!important;border-radius:50%!important;border:1px solid #d6bd78!important;background:#1c3e40!important}
@media(max-width:900px){.brand{padding:5px 3px 16px!important}.brand img[data-brand]{width:100%!important;height:auto!important}}
'''
          if 'Identidade visual Isabela Martins • v25' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          p.write_text(text, encoding='utf-8')
          print('Branding v25 aplicado ao login, menu e perfil.')
          PY

      - name: Criar configuracao Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.florindosistemas.isabelamartins",
            "appName": "Isabela Martins",
            "webDir": "www"
          }
          EOF

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Liberar microfone no Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text(encoding='utf-8')
          additions=[
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
            '<uses-feature android:name="android.hardware.microphone" android:required="false" />'
          ]
          missing=[x for x in additions if x not in text]
          if missing:
              m=re.search(r'<manifest[^>]*>', text)
              if not m: raise SystemExit('Tag manifest nao encontrada')
              text=text[:m.end()]+'\n    '+'\n    '.join(missing)+text[m.end():]
              p.write_text(text,encoding='utf-8')
          PY

      - name: Gerar novo icone IM
        run: |
          mkdir -p assets
          base64 -d icon_v25.b64 > assets/icon.png
          file assets/icon.png
          npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Isabela-Martins-v25-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
